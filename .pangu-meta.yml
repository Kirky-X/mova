# pangu harness 元数据（生成来源记录）。生成物归本项目所有，pangu 不会自动覆盖。
# 模板升级：对照 https://github.com/Kirky-X/pangu 对应版本 tag 的 templates/ 手动 diff。
pangu_version: 0.1.10
generated_at: 2026-11-25T16:57:22Z
coverage_threshold: 85
threshold_profile: core
default_branch: "main"
changelog: manual
release_workflow: enabled
codeql: enabled
harness_files:
  - .editorconfig
  - .github/CODEOWNERS
  - .github/ISSUE_TEMPLATE/bug.md
  - .github/ISSUE_TEMPLATE/feature.md
  - .github/ISSUE_TEMPLATE/question.md
  - .github/PULL_REQUEST_TEMPLATE.md
  - .github/dependabot.yml
  - .github/workflows/ci.yml
  - .github/workflows/codeql.yml
  - .github/workflows/release.yml
  - .gitignore
  - .pre-commit-config.yaml
  - clippy.toml
  - deny.toml
  - lefthook.yml
  - rustfmt.toml
